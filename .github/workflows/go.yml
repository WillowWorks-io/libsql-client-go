name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned, not floating. This was '>=1.21', which now resolves to Go 1.26
        # while golangci-lint-action@v6 ships a linter built with 1.24 -- so it
        # cannot typecheck the 1.26 standard library and the job fails on
        # stdlib source, with nothing wrong in this repo. 1.20 is the floor
        # go.mod declares; bump the ceiling deliberately alongside the linter.
        go: [ '1.21', '1.24' ]

    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          # go-version wins over go-version-file; setting both is confusing, and
          # the matrix is the thing we actually want to vary.
          cache: true
          go-version: ${{ matrix.go }}

      - name: Format
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Install dependencies
        run: go get ./...

      # sqliteparser is ANTLR-generated and full of unreachable code by
      # construction, so it is excluded rather than fixed. Matched on the package
      # suffix, NOT the full module path: the previous form hardcoded the
      # upstream path and silently stopped excluding anything the moment this
      # fork renamed the module, turning vet loose on 34k generated lines.
      - name: Vet
        run: go vet -v $(go list ./... | grep -v "/sqliteparser$")

      - name: Install sqlclosecheck
        run: |
          if [ "${{ matrix.go }}" = "1.20" ]; then
            go install github.com/ryanrolds/sqlclosecheck@v0.5.1
          else
            go install github.com/ryanrolds/sqlclosecheck@v0.6.0
          fi

      - name: sqlclosecheck
        run: go vet -vettool=${HOME}/go/bin/sqlclosecheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -parallel 1 ./...
        env:
          LIBSQL_TEST_HTTP_DB_URL: "http://127.0.0.1:8080"
          LIBSQL_TEST_WS_DB_URL: "ws://127.0.0.1:8080"
